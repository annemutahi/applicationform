{% extends "base.html" %}

{% block content %}
<div style="text-align: center; max-width: 400px; margin: auto; padding: 2rem; border: 2px solid #0047AB; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
<h2>Admin Login</h2>
<form method="POST" style="max-width: 300px; margin: auto; display: flex; flex-direction: column; gap: 1rem;">
    {% csrf_token %}
    <div class="mb-3">
    <label>Username:</label>
    <input type="text" name="username" required>
    </div>
    <div class="mb-3">
    <label>Password:</label>
    <input type="password" name="password" required>
    </div>
    <button type="submit">Login</button>
</form>
</div>
{% if messages %}
    <ul>
        {% for msg in messages %}
        <li>{{ msg }}</li>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
